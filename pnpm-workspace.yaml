overrides:
  vite: 8.1.3

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true

# minimumReleaseAgeExclude fast-tracks specific versions past pnpm's
# minimumReleaseAge (24 h) delay. Entries only match an exact version, so they
# stop doing anything once that version is installed and a day old. Pruned to
# empty on 2026-09-15 after the dependency bump; add a version here only while it
# is freshly published and needed before the delay elapses, then let it lapse.
minimumReleaseAgeExclude: []
